plugins {
    id 'com.android.application' version '8.7.3'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'com.chtai.assistant'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.chtai.assistant'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.3.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
    }
    // This repository keeps its Android sources and manifest at the repository root.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            // Only compile the six Kotlin source files stored at repository root.
            java.include '*.kt'
        }
    }
    externalNativeBuild {
        cmake { path 'CMakeLists.txt'; version '3.22.1' }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

// The Kotlin source root is the repository root; order Android asset/class tasks first.
tasks.named('compileDebugKotlin') {
    dependsOn 'mergeDebugAssets', 'compressDebugAssets', 'mergeExtDexDebug', 'checkDebugDuplicateClasses', 'desugarDebugFileDependencies'
}
