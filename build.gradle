plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.chtai.assistant'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.chtai.assistant'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '1.4.7'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3' } }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    // If a persistent signing key is supplied through GitHub Actions secrets,
    // use it for debug APKs too so future builds can update the installed app.
    signingConfigs {
        stable {
            def keyPath = System.getenv('JARVIS_KEYSTORE_FILE')
            if (keyPath != null && !keyPath.isEmpty()) {
                storeFile file(keyPath)
                storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('JARVIS_KEY_ALIAS')
                keyPassword System.getenv('JARVIS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('JARVIS_KEYSTORE_FILE') != null) {
                signingConfig signingConfigs.stable
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
