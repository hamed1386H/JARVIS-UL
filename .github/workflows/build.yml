name: Build JARVIS APK from source ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'JARVIS_v1.3_LocalAI_GitHub.zip', '.github/workflows/build.yml' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JARVIS source archive
        run: |
          test -f JARVIS_v1.3_LocalAI_GitHub.zip
          mkdir -p jarvis-source
          unzip -q JARVIS_v1.3_LocalAI_GitHub.zip -d jarvis-source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build APK with local llama.cpp runtime
        working-directory: jarvis-source
        run: gradle --no-daemon --max-workers=2 --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: jarvis-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
