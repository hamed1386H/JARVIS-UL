name: Build JARVIS APK from source ZIP
# Local AI target: Qwen3-4B-Q4_K_M via llama.cpp; model weights are downloaded separately by the app.
# RapidAPI support: X-RapidAPI-Key and X-RapidAPI-Host are added by JarvisAgentCore.

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'feature/**' ]
    paths: [ 'JARVIS_v1.3_LocalAI_GitHub.zip', 'MainActivity.kt', 'PersianCloudTts.kt', 'LocalAiEngine.kt', 'JarvisAgentCore.kt', 'JarvisOrbView.kt', 'WhisperEngine.kt', 'jarvis_whisper.cpp', 'jarvis_llama.cpp', 'WakeWordService.kt', 'CMakeLists.txt', 'launcher-res/**', '.github/workflows/build.yml' ]

permissions:
  contents: read

concurrency:
  group: jarvis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JARVIS source archive
        run: |
          test -f JARVIS_v1.3_LocalAI_GitHub.zip
          mkdir -p jarvis-source
          unzip -q JARVIS_v1.3_LocalAI_GitHub.zip -d jarvis-source

      - name: Apply latest in-app voice input implementation
        run: |
          install -D MainActivity.kt jarvis-source/app/src/main/java/com/chtai/assistant/MainActivity.kt
          install -D PersianCloudTts.kt jarvis-source/app/src/main/java/com/chtai/assistant/PersianCloudTts.kt
          install -D LocalAiEngine.kt jarvis-source/app/src/main/java/com/chtai/assistant/LocalAiEngine.kt
          install -D jarvis_llama.cpp jarvis-source/app/src/main/cpp/jarvis_llama.cpp
          install -D JarvisAgentCore.kt jarvis-source/app/src/main/java/com/chtai/assistant/JarvisAgentCore.kt
          install -D WakeWordService.kt jarvis-source/app/src/main/java/com/chtai/assistant/WakeWordService.kt
          install -D JarvisOrbView.kt jarvis-source/app/src/main/java/com/chtai/assistant/JarvisOrbView.kt
          install -D WhisperEngine.kt jarvis-source/app/src/main/java/com/chtai/assistant/WhisperEngine.kt
          install -D jarvis_whisper.cpp jarvis-source/app/src/main/cpp/jarvis_whisper.cpp
          install -D CMakeLists.txt jarvis-source/app/src/main/cpp/CMakeLists.txt
          cp -R launcher-res/. jarvis-source/app/src/main/res/
          sed -i 's/<application/<application android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' jarvis-source/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_CONTACTS" />' jarvis-source/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jarvis-source/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          missing = []
          if 'android.speech.RecognitionService' not in s:
              missing.append('''        <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>''')
          if 'android.intent.action.TTS_SERVICE' not in s:
              missing.append('''        <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>''')
          if missing:
              block = '\\n'.join(missing)
              if '<queries>' in s:
                  s = s.replace('<queries>', '<queries>\\n' + block, 1)
              else:
                  s = s.replace('</manifest>', '    <queries>\\n' + block + '\\n    </queries>\\n</manifest>')
              p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform, NDK and CMake
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Align Android Java and Kotlin JVM targets
        run: |
          cat > "$RUNNER_TEMP/jvm17.init.gradle" <<'EOF'
          allprojects {
            afterEvaluate {
              def androidExt = extensions.findByName("android")
              if (androidExt != null) {
                androidExt.compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                }
              }
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
              }
              tasks.matching { it.class.name.contains("KotlinCompile") }.configureEach {
                if (hasProperty("kotlinOptions")) {
                  kotlinOptions.jvmTarget = "17"
                }
              }
            }
          }
          EOF

      - name: Build APK with local llama.cpp runtime
        working-directory: jarvis-source
        run: gradle --no-daemon --max-workers=2 --stacktrace --init-script "$RUNNER_TEMP/jvm17.init.gradle" assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: jarvis-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
